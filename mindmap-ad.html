                        {id: "c_crtp", topic: "CRTP"}
                    ]},
                    { id: "paths", topic: "📚 Learning Paths", direction: "right", children: [
                        {id: "p_htb", topic: "HTB Academy Paths"},
                        {id: "p_thm", topic: "TryHackMe Paths"},
                        {id: "p_redteam", topic: "Intro to AD Path"},
                        {id: "p_ad_pentest", topic: "AD Pentester Path (HTB)"}
                    ]}
                ]
            }
        };

        const options = {
            container: 'jsmind_container', editable: false, theme: 'dark',
            view: { engine: 'svg', draggable: true, line_width: 2, line_color: '#ff4757' },
            layout: { hspace: 100, vspace: 25 }
        };

        let jm = new jsMind(options);
        jm.show(mind);

        setTimeout(() => {
            document.querySelectorAll('jmnode').forEach(n => {
                const id = n.getAttribute('nodeid');
                if (id?.startsWith('h_')) n.classList.add('htb');
                if (id?.startsWith('t_')) n.classList.add('thm');
                if (id?.startsWith('c_')) n.classList.add('cert');
                if (id?.startsWith('p_')) n.classList.add('thm');
                if (['basics','enum','attacks','adcs','lateral','persist','dominance','wmi','defense','c2','thm','certs','paths'].includes(id)) n.classList.add('cat');

                if (links[id]) {
                    n.style.cursor = 'pointer';
                    n.title = 'Click to open: ' + links[id];
                    n.addEventListener('click', (e) => {
                        e.stopPropagation();
                        window.open(links[id], '_blank');
                    });
                }
            });
        }, 300);
    </script>


<script>
// Mobile Menu - Ultra Simple v2
function toggleMobileMenu() {
    var menu = document.querySelector('.nav-links') || document.getElementById('navMenu');
    var jsmind = document.getElementById('jsmind_container');
    if (!menu) return;
    
    if (menu.classList.contains('open')) {
        menu.classList.remove('open');
        document.body.style.overflow = '';
        if (jsmind) jsmind.style.pointerEvents = '';
    } else {
        menu.classList.add('open');
        document.body.style.overflow = 'hidden';
        if (jsmind) jsmind.style.pointerEvents = 'none';
    }
    console.log('Menu:', menu.classList.contains('open'));
}

function toggleDropdown(btn) {
    if (window.innerWidth > 768) return;
    
    var dropdown = btn.parentElement;
    var wasOpen = dropdown.classList.contains('open');
    
    // Close all dropdowns
    var all = document.querySelectorAll('.nav-dropdown');
    for (var i = 0; i < all.length; i++) {
        all[i].classList.remove('open');
    }
    
    // Toggle this one
    if (!wasOpen) {
        dropdown.classList.add('open');
    }
    console.log('Dropdown:', !wasOpen);
}

function closeMobileMenu() {
    var menu = document.querySelector('.nav-links') || document.getElementById('navMenu');
    var jsmind = document.getElementById('jsmind_container');
    if (menu && window.innerWidth <= 768) {
        menu.classList.remove('open');
        document.body.style.overflow = '';
        if (jsmind) jsmind.style.pointerEvents = '';
    }
}

console.log('Mobile menu ready v2');
</script>


<script>
function toggleLegend() {
    var legend = document.querySelector('.legend');
    var btn = document.querySelector('.legend-toggle');
    if (legend) {
        legend.classList.toggle('show');
        if (btn) btn.classList.toggle('active');
    }
}
</script>
