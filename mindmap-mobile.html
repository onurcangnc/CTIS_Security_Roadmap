<script>
// Mobile Menu - Final Clean Version
(function() {
    var initialized = false;
    
    function init() {
        if (initialized) return;
        initialized = true;
        
        var menuBtn = document.querySelector('.mobile-toggle');
        var menu = document.querySelector('.nav-links') || document.getElementById('navMenu');
        
        if (!menuBtn || !menu) {
            console.log('Mobile menu: elements not found');
            return;
        }
        
        var isAnimating = false;
        
        // Toggle menu
        menuBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            if (isAnimating) return;
            isAnimating = true;
            
            menu.classList.toggle('open');
            document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
            console.log('Menu toggled:', menu.classList.contains('open'));
            
            setTimeout(function() { isAnimating = false; }, 100);
        });
        
        // Dropdown toggle - with debounce
        document.querySelectorAll('.nav-dropdown-btn').forEach(function(btn) {
            var clicking = false;
            
            btn.addEventListener('click', function(e) {
                if (window.innerWidth > 768) return;
                
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                
                if (clicking) return;
                clicking = true;
                
                var parent = this.parentElement;
                var wasOpen = parent.classList.contains('open');
                
                // Close all dropdowns first
                document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                    d.classList.remove('open');
                });
                
                // Toggle this one
                if (!wasOpen) {
                    parent.classList.add('open');
                }
                
                console.log('Dropdown toggled:', !wasOpen);
                
                setTimeout(function() { clicking = false; }, 150);
            });
        });
        
        // Close menu on link click
        menu.querySelectorAll('a').forEach(function(link) {
            link.addEventListener('click', function() {
                if (window.innerWidth <= 768) {
                    menu.classList.remove('open');
                    document.body.style.overflow = '';
                    document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                        d.classList.remove('open');
                    });
                }
            });
        });
        
        // Close on outside click - with delay to prevent conflicts
        document.addEventListener('click', function(e) {
            if (window.innerWidth > 768) return;
            if (!menu.classList.contains('open')) return;
            
            // Check if click is outside menu AND outside menu button
            if (!menu.contains(e.target) && !menuBtn.contains(e.target)) {
                menu.classList.remove('open');
                document.body.style.overflow = '';
                document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                    d.classList.remove('open');
                });
            }
        });
        
        // Close on ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && menu.classList.contains('open')) {
                menu.classList.remove('open');
                document.body.style.overflow = '';
                document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                    d.classList.remove('open');
                });
            }
        });
        
        // Handle resize
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                menu.classList.remove('open');
                document.body.style.overflow = '';
                document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                    d.classList.remove('open');
                });
            }
        });
        
        console.log('Mobile menu initialized');
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>


<script>
// Legend toggle
(function() {
    var btn = document.querySelector('.legend-toggle');
    var legend = document.querySelector('.legend');
    if (!btn || !legend) return;
    
    btn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        legend.classList.toggle('show');
        btn.classList.toggle('active');
    });
    
    document.addEventListener('click', function(e) {
        if (window.innerWidth <= 768 && legend.classList.contains('show')) {
            if (!legend.contains(e.target) && !btn.contains(e.target)) {
                legend.classList.remove('show');
                btn.classList.remove('active');
            }
        }
    });
})();
</script>
