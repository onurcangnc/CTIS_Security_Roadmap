<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Security - Mind Map</title>
    <script src="https://cdn.jsdelivr.net/npm/jsmind@0.8.5/es6/jsmind.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsmind@0.8.5/style/jsmind.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; min-height: 100vh; color: #fff; }

                /* Navigation */
        .nav { position: fixed; top: 0; left: 0; right: 0; background: rgba(10,10,15,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 1000; padding: 0 20px; }
        .nav-container { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 60px; }
        .nav-brand { font-weight: 700; font-size: 1rem; color: #e91e63; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; gap: 4px; align-items: center; }
        .nav-link { color: rgba(255,255,255,0.5); text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; white-space: nowrap; }
        .nav-link:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-link.active { background: #e91e63; color: #000; }
        .mobile-toggle { display: none; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; z-index: 1002; padding: 8px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        
        /* Dropdown Menu */
        .nav-dropdown { position: relative; }
        .nav-dropdown-btn { color: rgba(255,255,255,0.5); background: none; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.2s; font-family: inherit; }
        .nav-dropdown-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-dropdown-btn::after { content: '▼'; font-size: 0.6rem; margin-left: 2px; }
        .nav-dropdown-content { display: none; position: absolute; top: 100%; left: 0; background: rgba(10,10,15,0.98); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; min-width: 200px; padding: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); z-index: 1001; }
        .nav-dropdown:hover .nav-dropdown-content { display: block; }
        .nav-dropdown-content a { display: block; padding: 10px 14px; color: rgba(255,255,255,0.5); text-decoration: none; border-radius: 8px; font-size: 0.85rem; transition: all 0.2s; }
        .nav-dropdown-content a:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-dropdown-content .dropdown-header { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #e91e63; padding: 8px 14px 4px; font-weight: 600; }

        #jsmind_container { position: fixed; top: 60px; left: 0; right: 0; bottom: 0; z-index: 1; }

        .legend {
            position: fixed; bottom: 15px; left: 15px;
            background: rgba(10,10,15,0.95); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 12px; font-size: 0.7rem; z-index: 100;
        }
        .legend-title { color: #e91e63; font-weight: 600; margin-bottom: 8px; font-size: 0.75rem; }
        .legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; color: rgba(255,255,255,0.6); }
        .legend-dot { width: 10px; height: 10px; border-radius: 3px; }

        .controls { position: fixed; bottom: 15px; right: 15px; display: flex; gap: 6px; z-index: 100; }
        .ctrl-btn {
            width: 36px; height: 36px; border: 1px solid rgba(233,30,99,0.3); border-radius: 8px;
            background: rgba(10,10,15,0.9); color: #e91e63; cursor: pointer; font-size: 16px; transition: all 0.2s;
        }
        .ctrl-btn:hover { background: #e91e63; color: #fff; }

        .hint {
            position: fixed; top: 65px; right: 15px;
            background: rgba(233,30,99,0.1); border: 1px solid rgba(233,30,99,0.3);
            border-radius: 8px; padding: 8px 12px; font-size: 0.7rem; color: rgba(255,255,255,0.7); z-index: 100;
        }

        jmnode { font-family: 'Inter', sans-serif !important; border-radius: 6px !important; padding: 8px 14px !important; font-weight: 500 !important; font-size: 12px !important; cursor: pointer !important; transition: all 0.2s !important; }
        jmnode[nodeid="root"] { background: linear-gradient(135deg, #e91e63, #c2185b) !important; color: #fff !important; font-size: 14px !important; font-weight: 700 !important; padding: 12px 20px !important; }
        jmnode.cat { background: rgba(233,30,99,0.15) !important; color: #ec407a !important; border: 1px solid rgba(233,30,99,0.3) !important; font-weight: 600 !important; }
        jmnode.htb { background: #9fef00 !important; color: #000 !important; }
        jmnode.htb:hover { background: #7bc700 !important; box-shadow: 0 0 15px rgba(159,239,0,0.5) !important; }
        jmnode.thm { background: #1bd96a !important; color: #fff !important; }
        jmnode.thm:hover { background: #15b557 !important; box-shadow: 0 0 15px rgba(27,217,106,0.5) !important; }

        

        /* Mobile Legend Toggle */
        .legend-toggle {
            display: none;
            position: fixed;
            bottom: 15px;
            left: 15px;
            width: 44px;
            height: 44px;
            background: rgba(10,10,15,0.95);
            border: 1px solid rgba(255,71,87,0.3);
            border-radius: 10px;
            color: #ff4757;
            font-size: 18px;
            cursor: pointer;
            z-index: 101;
            transition: all 0.3s;
            align-items: center;
            justify-content: center;
        }
        .legend-toggle:hover { background: #ff4757; color: #fff; }
        .legend-toggle.active { background: #ff4757; color: #fff; }

        /* Responsive */
        @media (max-width: 768px) {
            .nav { padding: 0 16px; }
            .nav-container { height: 60px; }
            .nav-links { 
                display: none; 
                position: fixed; 
                top: 60px; 
                left: 0; 
                right: 0; 
                bottom: 0;
                background: rgba(10,10,15,0.98); 
                flex-direction: column; 
                padding: 20px; 
                overflow-y: auto; 
                z-index: 1001;
            }
            .nav-links.open { display: flex; }
            .mobile-toggle { display: block; }
            .nav-link { padding: 14px; font-size: 1rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
            .nav-dropdown { width: 100%; border-bottom: 1px solid rgba(255,255,255,0.08); }
            .nav-dropdown-btn { width: 100%; justify-content: space-between; padding: 14px; font-size: 1rem; }
            .nav-dropdown-content { 
                position: static; 
                box-shadow: none; 
                border: none; 
                background: rgba(255,255,255,0.02); 
                margin: 0;
                padding: 0 0 10px 20px;
                display: none;
            }
            .nav-dropdown:hover .nav-dropdown-content { display: none; }
            .nav-dropdown.open .nav-dropdown-content { display: block; }
            .nav-dropdown-content a { padding: 12px 14px; font-size: 0.95rem; }
            #jsmind_container { top: 60px; }
            
            /* Mobile Legend - Collapsible */
            .legend { 
                display: none;
                bottom: 70px;
                left: 15px;
                max-width: calc(100vw - 30px);
                animation: slideUp 0.3s ease;
            }
            .legend.show { display: block; }
            .legend-toggle { display: flex; }
            
            /* Mobile Controls */
            .controls {
                bottom: 15px;
                right: 15px;
                gap: 4px;
            }
            .ctrl-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            
            /* Mobile Hint - Hide on mobile */
            .hint { 
                display: none;
            }
        }
        
        @media (max-width: 480px) {
            .nav-brand { font-size: 0.85rem; }
            .legend { font-size: 0.65rem; padding: 10px; }
            .legend-title { font-size: 0.7rem; }
            .ctrl-btn { width: 36px; height: 36px; font-size: 16px; }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <script>
        const links = {
            // ============================================
            // HTB Academy Android Application Pentesting Path
            // All URLs verified Dec 2024
            // ============================================
            
            // Android Fundamentals
            "h_android_fund": "https://academy.hackthebox.com/course/preview/android-fundamentals",
            
            // Static Analysis
            "h_static": "https://academy.hackthebox.com/course/preview/android-application-static-analysis",
            
            // Dynamic Analysis
            "h_dynamic": "https://academy.hackthebox.com/course/preview/android-application-dynamic-analysis",
            
            // Malware Analysis
            "h_malware": "https://academy.hackthebox.com/course/preview/android-application-malware-analysis",
            
            // Automation
            "h_auto": "https://academy.hackthebox.com/course/preview/android-penetration-testing-automation",
            
            // Forensics
            "h_forensics": "https://academy.hackthebox.com/course/preview/android-forensics",
            
            // ============================================
            // TryHackMe Android Rooms (Verified)
            // ============================================
            "t_android_hacking": "https://tryhackme.com/room/androidhacking101",
            "t_android_malware": "https://tryhackme.com/room/androidmalwareanalysis",
            
            // Paths
            "p_htb_android": "https://academy.hackthebox.com/path/preview/android-application-pentesting",
            "p_htb": "https://academy.hackthebox.com/paths",
            "p_thm": "https://tryhackme.com/paths"
        };

        const mind = {
            meta: { name: "mobile", author: "ctis" },
            format: "node_tree",
            data: {
                id: "root", topic: "📱 MOBILE SECURITY", expanded: true,
                children: [
                    { id: "fundamentals", topic: "📖 Android Fundamentals", direction: "right", children: [
                        {id: "h_android_fund", topic: "HTB: Android Fundamentals"},
                        {id: "t_android_hacking", topic: "THM: Android Hacking 101"}
                    ]},
                    { id: "static", topic: "🔍 Static Analysis", direction: "right", children: [
                        {id: "h_static", topic: "HTB: Android Static Analysis"}
                    ]},
                    { id: "dynamic", topic: "⚡ Dynamic Analysis", direction: "right", children: [
                        {id: "h_dynamic", topic: "HTB: Android Dynamic Analysis"}
                    ]},
                    { id: "malware", topic: "🦠 Malware Analysis", direction: "left", children: [
                        {id: "h_malware", topic: "HTB: Android Malware Analysis"},
                        {id: "t_android_malware", topic: "THM: Android Malware Analysis"}
                    ]},
                    { id: "automation", topic: "🤖 Automation", direction: "left", children: [
                        {id: "h_auto", topic: "HTB: Android Pentesting Automation"}
                    ]},
                    { id: "forensics", topic: "🔬 Mobile Forensics", direction: "left", children: [
                        {id: "h_forensics", topic: "HTB: Android Forensics"}
                    ]},
                    { id: "paths", topic: "📚 Learning Paths", direction: "right", children: [
                        {id: "p_htb_android", topic: "Android Pentesting Path (HTB)"},
                        {id: "p_htb", topic: "HTB Academy Paths"},
                        {id: "p_thm", topic: "TryHackMe Paths"}
                    ]}
                ]
            }
        };

        const options = {
            container: 'jsmind_container', editable: false, theme: 'dark',
            view: { engine: 'svg', draggable: true, line_width: 2, line_color: '#e91e63' },
            layout: { hspace: 100, vspace: 25 }
        };

        let jm = new jsMind(options);
        jm.show(mind);

        setTimeout(() => {
            document.querySelectorAll('jmnode').forEach(n => {
                const id = n.getAttribute('nodeid');
                if (id?.startsWith('h_')) n.classList.add('htb');
                if (id?.startsWith('t_')) n.classList.add('thm');
                if (id?.startsWith('p_')) n.classList.add('htb');
                if (['fundamentals','static','dynamic','malware','automation','forensics','paths'].includes(id)) n.classList.add('cat');

                if (links[id]) {
                    n.style.cursor = 'pointer';
                    n.title = 'Click to open: ' + links[id];
                    n.addEventListener('click', (e) => {
                        e.stopPropagation();
                        window.open(links[id], '_blank');
                    });
                }
            });
        }, 300);
    </script>

    <script>
        // Mobile menu functionality - Fixed version
        (function() {
            const mobileToggle = document.getElementById('mobileToggle');
            const navMenu = document.getElementById('navMenu');
            
            if (!mobileToggle || !navMenu) {
                console.warn('Mobile menu elements not found');
                return;
            }
            
            // Toggle menu on click/touch
            function toggleMenu(e) {
                e.preventDefault();
                e.stopPropagation();
                navMenu.classList.toggle('open');
                mobileToggle.setAttribute('aria-expanded', navMenu.classList.contains('open'));
                // Close all dropdowns when toggling menu
                document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
            }
            
            mobileToggle.addEventListener('click', toggleMenu);
            mobileToggle.addEventListener('touchend', function(e) {
                e.preventDefault();
                toggleMenu(e);
            }, { passive: false });
            
            // Handle dropdown buttons
            document.querySelectorAll('.nav-dropdown-btn').forEach(btn => {
                function handleDropdown(e) {
                    if (window.innerWidth <= 768) {
                        e.preventDefault();
                        e.stopPropagation();
                        const parent = btn.parentElement;
                        const isOpen = parent.classList.contains('open');
                        // Close others
                        document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                        // Toggle this one
                        if (!isOpen) parent.classList.add('open');
                    }
                }
                btn.addEventListener('click', handleDropdown);
                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    handleDropdown(e);
                }, { passive: false });
            });
            
            // Close menu when clicking links
            document.querySelectorAll('.nav-dropdown-content a, .nav-links > .nav-link').forEach(link => {
                link.addEventListener('click', function() {
                    if (window.innerWidth <= 768) {
                        navMenu.classList.remove('open');
                        mobileToggle.setAttribute('aria-expanded', 'false');
                        document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                    }
                });
            });
            
            // Close menu when clicking outside
            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768 && navMenu.classList.contains('open')) {
                    if (!navMenu.contains(e.target) && !mobileToggle.contains(e.target)) {
                        navMenu.classList.remove('open');
                        mobileToggle.setAttribute('aria-expanded', 'false');
                        document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                    }
                }
            });
            
            // Handle resize
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    navMenu.classList.remove('open');
                    document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                }
            });
        })();
    </script>

    <script>
        // Legend toggle for mobile
        function toggleLegend() {
            const legend = document.querySelector('.legend');
            const toggleBtn = document.querySelector('.legend-toggle');
            if (legend && toggleBtn) {
                legend.classList.toggle('show');
                toggleBtn.classList.toggle('active');
            }
        }
        
        // Close legend when clicking outside on mobile
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 768) {
                const legend = document.querySelector('.legend');
                const toggleBtn = document.querySelector('.legend-toggle');
                if (legend && toggleBtn && legend.classList.contains('show')) {
                    if (!legend.contains(e.target) && !toggleBtn.contains(e.target)) {
                        legend.classList.remove('show');
                        toggleBtn.classList.remove('active');
                    }
                }
            }
        });
    </script>
</body>
