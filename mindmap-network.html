    <script>
        // Mobile menu functionality - Fixed version
        (function() {
            const mobileToggle = document.getElementById('mobileToggle');
            const navMenu = document.getElementById('navMenu');
            
            if (!mobileToggle || !navMenu) {
                console.warn('Mobile menu elements not found');
                return;
            }
            
            // Toggle menu on click/touch
            function toggleMenu(e) {
                e.preventDefault();
                e.stopPropagation();
                navMenu.classList.toggle('open');
                mobileToggle.setAttribute('aria-expanded', navMenu.classList.contains('open'));
                // Close all dropdowns when toggling menu
                document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
            }
            
            mobileToggle.addEventListener('click', toggleMenu);
            mobileToggle.addEventListener('touchend', function(e) {
                e.preventDefault();
                toggleMenu(e);
            }, { passive: false });
            
            // Handle dropdown buttons
            document.querySelectorAll('.nav-dropdown-btn').forEach(btn => {
                function handleDropdown(e) {
                    if (window.innerWidth <= 768) {
                        e.preventDefault();
                        e.stopPropagation();
                        const parent = btn.parentElement;
                        const isOpen = parent.classList.contains('open');
                        // Close others
                        document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                        // Toggle this one
                        if (!isOpen) parent.classList.add('open');
                    }
                }
                btn.addEventListener('click', handleDropdown);
                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    handleDropdown(e);
                }, { passive: false });
            });
            
            // Close menu when clicking links
            document.querySelectorAll('.nav-dropdown-content a, .nav-links > .nav-link').forEach(link => {
                link.addEventListener('click', function() {
                    if (window.innerWidth <= 768) {
                        navMenu.classList.remove('open');
                        mobileToggle.setAttribute('aria-expanded', 'false');
                        document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                    }
                });
            });
            
            // Close menu when clicking outside
            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768 && navMenu.classList.contains('open')) {
                    if (!navMenu.contains(e.target) && !mobileToggle.contains(e.target)) {
                        navMenu.classList.remove('open');
                        mobileToggle.setAttribute('aria-expanded', 'false');
                        document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                    }
                }
            });
            
            // Handle resize
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    navMenu.classList.remove('open');
                    document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                }
            });
        })();
    </script>

    <script>
        // Legend toggle for mobile
        function toggleLegend() {
            const legend = document.querySelector('.legend');
            const toggleBtn = document.querySelector('.legend-toggle');
            if (legend && toggleBtn) {
                legend.classList.toggle('show');
                toggleBtn.classList.toggle('active');
            }
        }
        
        // Close legend when clicking outside on mobile
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 768) {
                const legend = document.querySelector('.legend');
                const toggleBtn = document.querySelector('.legend-toggle');
                if (legend && toggleBtn && legend.classList.contains('show')) {
                    if (!legend.contains(e.target) && !toggleBtn.contains(e.target)) {
                        legend.classList.remove('show');
                        toggleBtn.classList.remove('active');
                    }
                }
            }
        });
    </script>
<script>
(function() {
    'use strict';
    
    // Mobile Menu Toggle
    var hamburger = document.querySelector('.mobile-toggle');
    var navLinks = document.querySelector('.nav-links') || document.getElementById('navMenu');
    
    if (hamburger && navLinks) {
        // Make sure navMenu id exists
        if (!navLinks.id) navLinks.id = 'navMenu';
        
        hamburger.onclick = function(e) {
            e.preventDefault();
            e.stopPropagation();
            navLinks.classList.toggle('open');
            document.body.style.overflow = navLinks.classList.contains('open') ? 'hidden' : '';
        };
    }
    
    // Dropdown Toggles
    var dropdownBtns = document.querySelectorAll('.nav-dropdown-btn');
    dropdownBtns.forEach(function(btn) {
        btn.onclick = function(e) {
            if (window.innerWidth <= 768) {
                e.preventDefault();
                e.stopPropagation();
                var parent = this.parentElement;
                var isOpen = parent.classList.contains('open');
                // Close all
                document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                    d.classList.remove('open');
                });
                // Toggle current
                if (!isOpen) {
                    parent.classList.add('open');
                }
            }
        };
    });
    
    // Close menu on link click
    var allLinks = document.querySelectorAll('.nav-links a');
    allLinks.forEach(function(link) {
        link.onclick = function() {
            if (window.innerWidth <= 768 && navLinks) {
                setTimeout(function() {
                    navLinks.classList.remove('open');
                    document.body.style.overflow = '';
                    document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                        d.classList.remove('open');
                    });
                }, 150);
            }
        };
    });
    
    // Close on resize
    window.onresize = function() {
        if (window.innerWidth > 768 && navLinks) {
            navLinks.classList.remove('open');
            document.body.style.overflow = '';
        }
    };
})();
</script>
