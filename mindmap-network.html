    <script>
        // Legend toggle for mobile
        function toggleLegend() {
            const legend = document.querySelector('.legend');
            const toggleBtn = document.querySelector('.legend-toggle');
            if (legend && toggleBtn) {
                legend.classList.toggle('show');
                toggleBtn.classList.toggle('active');
            }
        }
        
        // Close legend when clicking outside on mobile
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 768) {
                const legend = document.querySelector('.legend');
                const toggleBtn = document.querySelector('.legend-toggle');
                if (legend && toggleBtn && legend.classList.contains('show')) {
                    if (!legend.contains(e.target) && !toggleBtn.contains(e.target)) {
                        legend.classList.remove('show');
                        toggleBtn.classList.remove('active');
                    }
                }
            }
        });
    </script>

    (function() {
        var toggle = document.getElementById('mobileToggle');
        var menu = document.getElementById('navMenu');
        
        if (!toggle || !menu) return;
        
        // Clone to remove old listeners
        var newToggle = toggle.cloneNode(true);
        toggle.parentNode.replaceChild(newToggle, toggle);
        toggle = newToggle;
        
        function openMenu() {
            menu.classList.add('open');
            toggle.setAttribute('aria-expanded', 'true');
        }
        
        function closeMenu() {
            menu.classList.remove('open');
            toggle.setAttribute('aria-expanded', 'false');
            document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                d.classList.remove('open');
            });
        }
        
        function toggleMenu(e) {
            e.preventDefault();
            e.stopPropagation();
            if (menu.classList.contains('open')) {
                closeMenu();
            } else {
                openMenu();
            }
        }
        
        toggle.addEventListener('click', toggleMenu);
        
        // Dropdown handling
        document.querySelectorAll('.nav-dropdown-btn').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    e.preventDefault();
                    e.stopPropagation();
                    var parent = this.parentElement;
                    var isOpen = parent.classList.contains('open');
                    document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                        d.classList.remove('open');
                    });
                    if (!isOpen) parent.classList.add('open');
                }
            });
        });
        
        // Close on link click
        document.querySelectorAll('.nav-dropdown-content a, .nav-links > .nav-link').forEach(function(link) {
            link.addEventListener('click', function() {
                if (window.innerWidth <= 768) closeMenu();
            });
        });
        
        // Close on outside click
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 768 && menu.classList.contains('open')) {
                if (!menu.contains(e.target) && !toggle.contains(e.target)) {
                    closeMenu();
                }
            }
        });
    })();
    </script>
</body>
</html>
