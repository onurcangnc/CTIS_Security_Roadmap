<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network & Infrastructure - Mind Map</title>
    <script src="https://cdn.jsdelivr.net/npm/jsmind@0.8.5/es6/jsmind.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsmind@0.8.5/style/jsmind.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; min-height: 100vh; color: #fff; }

        /* Navigation */
        .nav { position: fixed; top: 0; left: 0; right: 0; background: rgba(10,10,15,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 1000; padding: 0 20px; }
        .nav-container { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 60px; }
        .nav-brand { font-weight: 700; font-size: 1rem; color: #ff4757; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; gap: 4px; align-items: center; }
        .nav-link { color: rgba(255,255,255,0.5); text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; white-space: nowrap; }
        .nav-link:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-link.active { background: #ff4757; color: #000; }
        .mobile-toggle { display: none; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; z-index: 1002; padding: 8px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

        /* Dropdown Menu */
        .nav-dropdown { position: relative; }
        .nav-dropdown-btn { color: rgba(255,255,255,0.5); background: none; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.2s; font-family: inherit; }
        .nav-dropdown-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-dropdown-btn::after { content: '▼'; font-size: 0.6rem; margin-left: 2px; }
        .nav-dropdown-content { display: none; position: absolute; top: 100%; left: 0; background: rgba(10,10,15,0.98); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; min-width: 200px; padding: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); z-index: 1001; }
        .nav-dropdown:hover .nav-dropdown-content { display: block; }
        .nav-dropdown-content a { display: block; padding: 10px 14px; color: rgba(255,255,255,0.5); text-decoration: none; border-radius: 8px; font-size: 0.85rem; transition: all 0.2s; }
        .nav-dropdown-content a:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-dropdown-content .dropdown-header { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #ff4757; padding: 8px 14px 4px; font-weight: 600; }

        #jsmind_container { position: fixed; top: 60px; left: 0; right: 0; bottom: 0; z-index: 1; }

        .legend {
            position: fixed; bottom: 15px; left: 15px;
            background: rgba(10,10,15,0.95); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 12px; font-size: 0.7rem; z-index: 100;
        }
        .legend-title { color: #ff4757; font-weight: 600; margin-bottom: 8px; font-size: 0.75rem; }
        .legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; color: rgba(255,255,255,0.6); }
        .legend-dot { width: 10px; height: 10px; border-radius: 3px; }

        .controls { position: fixed; bottom: 15px; right: 15px; display: flex; gap: 6px; z-index: 100; }
        .ctrl-btn {
            width: 36px; height: 36px; border: 1px solid rgba(255,71,87,0.3); border-radius: 8px;
            background: rgba(10,10,15,0.9); color: #ff4757; cursor: pointer; font-size: 16px; transition: all 0.2s;
        }
        .ctrl-btn:hover { background: #ff4757; color: #fff; }

        .hint {
            position: fixed; top: 65px; right: 15px;
            background: rgba(255,71,87,0.1); border: 1px solid rgba(255,71,87,0.3);
            border-radius: 8px; padding: 8px 12px; font-size: 0.7rem; color: rgba(255,255,255,0.7); z-index: 100;
        }

        jmnode { font-family: 'Inter', sans-serif !important; border-radius: 6px !important; padding: 8px 14px !important; font-weight: 500 !important; font-size: 12px !important; cursor: pointer !important; transition: all 0.2s !important; }
        jmnode[nodeid="root"] { background: linear-gradient(135deg, #ff4757, #c0392b) !important; color: #fff !important; font-size: 14px !important; font-weight: 700 !important; padding: 12px 20px !important; }
        jmnode.cat { background: rgba(255,71,87,0.15) !important; color: #ff6b81 !important; border: 1px solid rgba(255,71,87,0.3) !important; font-weight: 600 !important; }
        jmnode.htb { background: #9fef00 !important; color: #000 !important; }
        jmnode.htb:hover { background: #7bc700 !important; box-shadow: 0 0 15px rgba(159,239,0,0.5) !important; }
        jmnode.thm { background: #1bd96a !important; color: #fff !important; }
        jmnode.thm:hover { background: #15b557 !important; box-shadow: 0 0 15px rgba(27,217,106,0.5) !important; }
        jmnode.cert { background: #f39c12 !important; color: #000 !important; font-weight: 600 !important; }
        jmnode.cert:hover { background: #d68910 !important; box-shadow: 0 0 15px rgba(243,156,18,0.5) !important; }

        /* Mobile Legend Toggle */
        .legend-toggle {
            display: none;
            position: fixed;
            bottom: 15px;
            left: 15px;
            width: 44px;
            height: 44px;
            background: rgba(10,10,15,0.95);
            border: 1px solid rgba(255,71,87,0.3);
            border-radius: 10px;
            color: #ff4757;
            font-size: 18px;
            cursor: pointer;
            z-index: 101;
            transition: all 0.3s;
            align-items: center;
            justify-content: center;
        }
        .legend-toggle:hover { background: #ff4757; color: #fff; }
        .legend-toggle.active { background: #ff4757; color: #fff; }

        /* ========== MOBILE RESPONSIVE ========== */
        @media screen and (max-width: 768px) {
            .mobile-toggle {
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                width: 44px !important;
                height: 44px !important;
                background: none !important;
                border: none !important;
                color: #fff !important;
                font-size: 28px !important;
                cursor: pointer !important;
                z-index: 99999 !important;
                -webkit-tap-highlight-color: transparent !important;
            }

            .nav-links {
                position: fixed !important;
                top: 60px !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                width: 100% !important;
                height: calc(100vh - 60px) !important;
                background: #0a0a0f !important;
                display: none !important;
                flex-direction: column !important;
                overflow-y: auto !important;
                z-index: 99998 !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .nav-links.open {
                display: flex !important;
            }

            .nav-links > .nav-link {
                display: block !important;
                width: 100% !important;
                padding: 18px 24px !important;
                font-size: 18px !important;
                color: #fff !important;
                text-decoration: none !important;
                border-bottom: 1px solid rgba(255,255,255,0.1) !important;
                box-sizing: border-box !important;
            }

            .nav-dropdown {
                width: 100% !important;
                border-bottom: 1px solid rgba(255,255,255,0.1) !important;
            }

            .nav-dropdown-btn {
                display: flex !important;
                width: 100% !important;
                padding: 18px 24px !important;
                font-size: 18px !important;
                color: #fff !important;
                background: transparent !important;
                border: none !important;
                cursor: pointer !important;
                justify-content: space-between !important;
                align-items: center !important;
                box-sizing: border-box !important;
            }

            .nav-dropdown-btn::after {
                content: "▼" !important;
                font-size: 12px !important;
                transition: transform 0.2s !important;
            }

            .nav-dropdown.open > .nav-dropdown-btn::after {
                transform: rotate(180deg) !important;
            }

            .nav-dropdown-content {
                display: none !important;
                position: static !important;
                width: 100% !important;
                background: rgba(255,255,255,0.02) !important;
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
            }

            .nav-dropdown.open > .nav-dropdown-content {
                display: block !important;
            }

            .nav-dropdown:hover > .nav-dropdown-content {
                display: none !important;
            }
            .nav-dropdown.open:hover > .nav-dropdown-content {
                display: block !important;
            }

            .nav-dropdown-content a {
                display: block !important;
                padding: 16px 24px 16px 48px !important;
                font-size: 16px !important;
                color: rgba(255,255,255,0.8) !important;
                text-decoration: none !important;
                border-bottom: 1px solid rgba(255,255,255,0.05) !important;
            }

            .nav-dropdown-content .dropdown-header {
                padding: 12px 24px 8px 48px !important;
                font-size: 11px !important;
                color: #ff4757 !important;
            }

            #jsmind_container { top: 60px; }
            .legend { display: none; }
            .legend.show { display: block; bottom: 70px; }
            .legend-toggle { display: flex; }
            .hint { display: none; }
        }

        @media (max-width: 480px) {
            .nav-brand { font-size: 0.85rem; }
            .legend { font-size: 0.65rem; padding: 10px; }
            .legend-title { font-size: 0.7rem; }
            .ctrl-btn { width: 36px; height: 36px; font-size: 16px; }
        }
    </style>
</head>
<body>
    <button class="legend-toggle" id="legendToggle">📋</button>

    <nav class="nav">
        <div class="nav-container">

                <span>🔌</span> Network & Infrastructure
            </a>
            <button class="mobile-toggle" onclick="document.getElementById('navMenu').classList.toggle('open'); document.body.style.overflow = document.getElementById('navMenu').classList.contains('open') ? 'hidden' : '';">☰</button>
            <div class="nav-links" id="navMenu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="mindmap-circular.html" class="nav-link">🎯 Overview</a>

                <div class="nav-dropdown">
                    <button class="nav-dropdown-btn" onclick="if(window.innerWidth<=768){event.stopPropagation();this.parentElement.classList.toggle('open');}">Offensive</button>
                    <div class="nav-dropdown-content">

                <a href="mindmap-ai.html" class="nav-link">🤖 AI</a>

                <div class="nav-dropdown">
                    <button class="nav-dropdown-btn" onclick="if(window.innerWidth<=768){event.stopPropagation();this.parentElement.classList.toggle('open');}">Resources</button>
                    <div class="nav-dropdown-content">

    <div class="hint">💡 Click any module to open training</div>

    <div class="legend">
        <div class="legend-title">LEGEND</div>
        <div class="legend-item"><div class="legend-dot" style="background:#9fef00"></div> HTB Academy</div>
        <div class="legend-item"><div class="legend-dot" style="background:#1bd96a"></div> TryHackMe</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f39c12"></div> Certification</div>

    <div class="controls">
        <button class="ctrl-btn" onclick="jm.view.zoomIn()">+</button>
        <button class="ctrl-btn" onclick="jm.view.zoomOut()">−</button>
        <button class="ctrl-btn" onclick="jm.view.setZoom(1)">⟲</button>
    </div>

<script>
// Network & Infrastructure Mind Map Data
const mind_data = {
    "meta": {
        "name": "Network & Infrastructure",
        "author": "CTIS Security Roadmap",
        "version": "1.0"
    },
    "format": "node_tree",
    "data": {
        "id": "root",
        "topic": "🔌 Network & Infrastructure",
        "direction": "right",
        "expanded": true,
        "children": [
            {
                "id": "enum",
                "topic": "🔍 Network Enumeration",
                "children": [
                    {"id": "enum1", "topic": "Introduction to Networking", "cls": "htb", "url": "https://academy.hackthebox.com/course/preview/introduction-to-networking"},
                    {"id": "enum2", "topic": "Network Enumeration with Nmap", "cls": "htb", "url": "https://academy.hackthebox.com/course/preview/network-enumeration-with-nmap"},
                    {"id": "enum3", "topic": "Advanced Nmap", "cls": "htb", "url": "https://academy.hackthebox.com/course/preview/advanced-nmap"},
                    {"id": "enum4", "topic": "Nmap", "cls": "thm", "url": "https://tryhackme.com/room/furthernmap"}
                ]
            },
            {
                "id": "protocols",
                "topic": "📡 Network Protocols",
                "children": [
                    {"id": "proto1", "topic": "SMB & NTLM", "cls": "htb", "url": "https://academy.hackthebox.com/course/preview/smb-ntlm"},
                    {"id": "proto2", "topic": "LDAP", "cls": "htb", "url": "https://academy.hackthebox.com/course/preview/ldap"},
                    {"id": "proto3", "topic": "DNS in Depth", "cls": "htb", "url": "https://academy.hackthebox.com/course/preview/dns-in-depth"},
                    {"id": "proto4", "topic": "MSSQL & MySQL", "cls": "htb", "url": "https://academy.hackthebox.com/course/preview/mssql-mysql"},
                    {"id": "proto5", "topic": "SMB", "cls": "thm", "url": "https://tryhackme.com/room/smb"}
                ]
            },
            {
                "id": "privesc",
                "topic": "⬆️ Privilege Escalation",
                "children": [
                    {"id": "pe1", "topic": "Linux Privilege Escalation", "cls": "htb", "url": "https://academy.hackthebox.com/course/preview/linux-privilege-escalation"},
                    {"id": "pe2", "topic": "Windows Privilege Escalation", "cls": "htb", "url": "https://academy.hackthebox.com/course/preview/windows-privilege-escalation"},
                    {"id": "pe3", "topic": "Linux Privesc", "cls": "thm", "url": "https://tryhackme.com/room/linuxprivesc"},
                    {"id": "pe4", "topic": "Windows Privesc", "cls": "thm", "url": "https://tryhackme.com/room/windows10privesc"}
                ]
            },
            {
                "id": "pivoting",
                "topic": "🔀 Pivoting & Tunneling",
                "children": [
                    {"id": "pivot1", "topic": "Introduction to Pivoting", "cls": "htb", "url": "https://academy.hackthebox.com/course/preview/introduction-to-pivoting"},
                    {"id": "pivot2", "topic": "SSH Tunneling", "cls": "htb", "url": "https://academy.hackthebox.com/course/preview/ssh-tunneling-for-penetration-testers"},
                    {"id": "pivot3", "topic": "Tunneling", "cls": "htb", "url": "https://academy.hackthebox.com/course/preview/tunneling"},
                    {"id": "pivot4", "topic": "Pivoting", "cls": "thm", "url": "https://tryhackme.com/room/pivotingtunneling"}
                ]
            },
            {
                "id": "metasploit",
                "topic": "💥 Metasploit Framework",
                "children": [
                    {"id": "msf1", "topic": "Introduction to Metasploit", "cls": "htb", "url": "https://academy.hackthebox.com/course/preview/introduction-to-metasploit"},
                    {"id": "msf2", "topic": "Metasploit", "cls": "thm", "url": "https://tryhackme.com/room/metasploitintro"}
                ]
            },
            {
                "id": "password",
                "topic": "🔐 Password Attacks",
                "children": [
                    {"id": "pass1", "topic": "Password Attacks", "cls": "htb", "url": "https://academy.hackthebox.com/course/preview/password-attacks"},
                    {"id": "pass2", "topic": "John the Ripper", "cls": "htb", "url": "https://academy.hackthebox.com/course/preview/john-the-ripper"},
                    {"id": "pass3", "topic": "Password Cracking", "cls": "thm", "url": "https://tryhackme.com/room/passwordcracking"}
                ]
            }
        ]
    }
};

// Initialize jsMind
const options = {
    container: 'jsmind_container',
    theme: 'primary',
    editable: false,
    view: {
        hmargin: 120,
        vmargin: 80,
        line_width: 2,
        line_color: '#ff4757'
    },
    layout: {
        hspace: 80,
        vspace: 20,
        pspace: 15
    }
};

const jm = new jsMind(options);
jm.show(mind_data);

// Click handler for nodes with URLs
jm.add_event_listener(function(type, data) {
    if (type === 2) {
        const node = data.node;
        if (node && node.data && node.data.url) {
            window.open(node.data.url, '_blank');
        }
    }
});

// ===== MOBILE MENU SCRIPT =====
document.addEventListener('DOMContentLoaded', function() {
    var menuBtn = document.querySelector('.mobile-toggle');
    var menu = document.getElementById('navMenu') || document.querySelector('.nav-links');

    if (!menuBtn || !menu) return;

    menuBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        menu.classList.toggle('open');
        document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
    });

    var ddBtns = document.querySelectorAll('.nav-dropdown-btn');
    for (var i = 0; i < ddBtns.length; i++) {
        ddBtns[i].addEventListener('click', function(e) {
            if (window.innerWidth <= 768) {
                e.preventDefault();
                e.stopPropagation();
                var dd = this.parentElement;
                var wasOpen = dd.classList.contains('open');
                var allDd = document.querySelectorAll('.nav-dropdown');
                for (var j = 0; j < allDd.length; j++) {
                    allDd[j].classList.remove('open');
                }
                if (!wasOpen) dd.classList.add('open');
            }
        });
    }

    var links = menu.querySelectorAll('a');
    for (var i = 0; i < links.length; i++) {
        links[i].addEventListener('click', function() {
            if (window.innerWidth <= 768) {
                menu.classList.remove('open');
                document.body.style.overflow = '';
            }
        });
    }

    var legendToggle = document.getElementById('legendToggle');
    var legend = document.querySelector('.legend');
    if (legendToggle && legend) {
        legendToggle.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            legend.classList.toggle('show');
            legendToggle.classList.toggle('active');
        });
    }
});
</script>

</body>
</html>
