    <script>
        // Mobile menu functionality - Fixed version
        (function() {
            const mobileToggle = document.getElementById('mobileToggle');
            const navMenu = document.getElementById('navMenu');
            
            if (!mobileToggle || !navMenu) {
                console.warn('Mobile menu elements not found');
                return;
            }
            
            // Toggle menu on click/touch
            function toggleMenu(e) {
                e.preventDefault();
                e.stopPropagation();
                navMenu.classList.toggle('open');
                mobileToggle.setAttribute('aria-expanded', navMenu.classList.contains('open'));
                // Close all dropdowns when toggling menu
                document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
            }
            
            mobileToggle.addEventListener('click', toggleMenu);
            mobileToggle.addEventListener('touchend', function(e) {
                e.preventDefault();
                toggleMenu(e);
            }, { passive: false });
            
            // Handle dropdown buttons
            document.querySelectorAll('.nav-dropdown-btn').forEach(btn => {
                function handleDropdown(e) {
                    if (window.innerWidth <= 768) {
                        e.preventDefault();
                        e.stopPropagation();
                        const parent = btn.parentElement;
                        const isOpen = parent.classList.contains('open');
                        // Close others
                        document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                        // Toggle this one
                        if (!isOpen) parent.classList.add('open');
                    }
                }
                btn.addEventListener('click', handleDropdown);
                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    handleDropdown(e);
                }, { passive: false });
            });
            
            // Close menu when clicking links
            document.querySelectorAll('.nav-dropdown-content a, .nav-links > .nav-link').forEach(link => {
                link.addEventListener('click', function() {
                    if (window.innerWidth <= 768) {
                        navMenu.classList.remove('open');
                        mobileToggle.setAttribute('aria-expanded', 'false');
                        document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                    }
                });
            });
            
            // Close menu when clicking outside
            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768 && navMenu.classList.contains('open')) {
                    if (!navMenu.contains(e.target) && !mobileToggle.contains(e.target)) {
                        navMenu.classList.remove('open');
                        mobileToggle.setAttribute('aria-expanded', 'false');
                        document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                    }
                }
            });
            
            // Handle resize
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    navMenu.classList.remove('open');
                    document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                }
            });
        })();
    </script>

    <script>
        // Legend toggle for mobile
        function toggleLegend() {
            const legend = document.querySelector('.legend');
            const toggleBtn = document.querySelector('.legend-toggle');
            if (legend && toggleBtn) {
                legend.classList.toggle('show');
                toggleBtn.classList.toggle('active');
            }
        }
        
        // Close legend when clicking outside on mobile
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 768) {
                const legend = document.querySelector('.legend');
                const toggleBtn = document.querySelector('.legend-toggle');
                if (legend && toggleBtn && legend.classList.contains('show')) {
                    if (!legend.contains(e.target) && !toggleBtn.contains(e.target)) {
                        legend.classList.remove('show');
                        toggleBtn.classList.remove('active');
                    }
                }
            }
        });
    </script>

    <script>
    // Mobile Menu & Legend Toggle
    (function() {
        // Mobile Menu
        var toggle = document.getElementById('mobileToggle');
        var menu = document.getElementById('navMenu');
        
        if (toggle && menu) {
            toggle.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                menu.classList.toggle('open');
                if (menu.classList.contains('open')) {
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = '';
                }
            });
            
            // Dropdown toggle
            document.querySelectorAll('.nav-dropdown-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    if (window.innerWidth <= 768) {
                        e.preventDefault();
                        e.stopPropagation();
                        var dd = this.parentElement;
                        var wasOpen = dd.classList.contains('open');
                        document.querySelectorAll('.nav-dropdown').forEach(function(d) { d.classList.remove('open'); });
                        if (!wasOpen) dd.classList.add('open');
                    }
                });
            });
            
            // Close menu on link click
            menu.querySelectorAll('a').forEach(function(a) {
                a.addEventListener('click', function() {
                    if (window.innerWidth <= 768) {
                        menu.classList.remove('open');
                        document.body.style.overflow = '';
                    }
                });
            });
        }
        
        // Legend Toggle
        var legendToggle = document.getElementById('legendToggle');
        var legend = document.querySelector('.legend');
        
        if (legendToggle && legend) {
            legendToggle.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                legend.classList.toggle('show');
                legendToggle.classList.toggle('active');
            });
            
            // Close on outside click
            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    if (!e.target.closest('#legendToggle, .legend')) {
                        legend.classList.remove('show');
                        legendToggle.classList.remove('active');
                    }
                }
            });
        }
    })();
    </script>
