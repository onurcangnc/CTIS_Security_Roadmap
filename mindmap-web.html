<script>
// Mobile Menu - Event Delegation Version
(function() {
    var menu, menuBtn;
    
    function init() {
        menuBtn = document.querySelector('.mobile-toggle');
        menu = document.querySelector('.nav-links') || document.getElementById('navMenu');
        
        if (!menuBtn || !menu) {
            console.log('Mobile menu: elements not found');
            return;
        }
        
        console.log('Mobile menu initialized');
    }
    
    // Single event listener for everything
    document.addEventListener('click', function(e) {
        if (!menu || !menuBtn) return;
        if (window.innerWidth > 768) return;
        
        var target = e.target;
        
        // Check if clicked on mobile toggle button
        if (target.closest('.mobile-toggle')) {
            e.preventDefault();
            e.stopPropagation();
            menu.classList.toggle('open');
            document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
            console.log('Menu toggled:', menu.classList.contains('open'));
            return;
        }
        
        // Check if clicked on dropdown button
        var dropdownBtn = target.closest('.nav-dropdown-btn');
        if (dropdownBtn) {
            e.preventDefault();
            e.stopPropagation();
            
            var dropdown = dropdownBtn.closest('.nav-dropdown');
            var wasOpen = dropdown.classList.contains('open');
            
            // Close all dropdowns
            document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                d.classList.remove('open');
            });
            
            // Toggle clicked one
            if (!wasOpen) {
                dropdown.classList.add('open');
            }
            
            console.log('Dropdown toggled:', !wasOpen);
            return;
        }
        
        // Check if clicked on a link inside menu
        var link = target.closest('.nav-dropdown-content a, .nav-links > .nav-link');
        if (link && menu.contains(link)) {
            // Let the link work, but close menu after small delay
            setTimeout(function() {
                menu.classList.remove('open');
                document.body.style.overflow = '';
                document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                    d.classList.remove('open');
                });
            }, 100);
            return;
        }
        
        // Outside click - close menu
        if (menu.classList.contains('open')) {
            if (!menu.contains(target) && !menuBtn.contains(target)) {
                menu.classList.remove('open');
                document.body.style.overflow = '';
                document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                    d.classList.remove('open');
                });
                console.log('Menu closed (outside click)');
            }
        }
    }, true); // Use capture phase
    
    // ESC key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && menu && menu.classList.contains('open')) {
            menu.classList.remove('open');
            document.body.style.overflow = '';
            document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                d.classList.remove('open');
            });
        }
    });
    
    // Resize
    window.addEventListener('resize', function() {
        if (window.innerWidth > 768 && menu) {
            menu.classList.remove('open');
            document.body.style.overflow = '';
            document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                d.classList.remove('open');
            });
        }
    });
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>


<script>
// Legend toggle
(function() {
    document.addEventListener('click', function(e) {
        var btn = e.target.closest('.legend-toggle');
        var legend = document.querySelector('.legend');
        
        if (btn && legend) {
            e.preventDefault();
            e.stopPropagation();
            legend.classList.toggle('show');
            btn.classList.toggle('active');
            return;
        }
        
        // Close legend on outside click
        if (legend && legend.classList.contains('show')) {
            var legendBtn = document.querySelector('.legend-toggle');
            if (!legend.contains(e.target) && (!legendBtn || !legendBtn.contains(e.target))) {
                legend.classList.remove('show');
                if (legendBtn) legendBtn.classList.remove('active');
            }
        }
    });
})();
</script>
