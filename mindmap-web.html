    <script>
        document.addEventListener('DOMContentLoaded', function() {
        // Mobile menu functionality - Fixed version
        (function() {
            const mobileToggle = document.getElementById('mobileToggle');
            const navMenu = document.getElementById('navMenu');
            
            if (!mobileToggle || !navMenu) {
                console.warn('Mobile menu elements not found');
                return;
            }
            
            // Toggle menu on click/touch
            function toggleMenu(e) {
                e.preventDefault();
                e.stopPropagation();
                navMenu.classList.toggle('open');
                mobileToggle.setAttribute('aria-expanded', navMenu.classList.contains('open'));
                // Close all dropdowns when toggling menu
                document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
            }
            
            mobileToggle.addEventListener('click', toggleMenu);
            mobileToggle.addEventListener('touchend', function(e) {
                e.preventDefault();
                toggleMenu(e);
            }, { passive: false });
            
            // Handle dropdown buttons
            document.querySelectorAll('.nav-dropdown-btn').forEach(btn => {
                function handleDropdown(e) {
                    if (window.innerWidth <= 768) {
                        e.preventDefault();
                        e.stopPropagation();
                        const parent = btn.parentElement;
                        const isOpen = parent.classList.contains('open');
                        // Close others
                        document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                        // Toggle this one
                        if (!isOpen) parent.classList.add('open');
                    }
                }
                btn.addEventListener('click', handleDropdown);
                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    handleDropdown(e);
                }, { passive: false });
            });
            
            // Close menu when clicking links
            document.querySelectorAll('.nav-dropdown-content a, .nav-links > .nav-link').forEach(link => {
                link.addEventListener('click', function() {
                    if (window.innerWidth <= 768) {
                        navMenu.classList.remove('open');
                        mobileToggle.setAttribute('aria-expanded', 'false');
                        document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                    }
                });
            });
            
            // Close menu when clicking outside
            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768 && navMenu.classList.contains('open')) {
                    if (!navMenu.contains(e.target) && !mobileToggle.contains(e.target)) {
                        navMenu.classList.remove('open');
                        mobileToggle.setAttribute('aria-expanded', 'false');
                        document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                    }
                }
            });
            
            // Handle resize
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    navMenu.classList.remove('open');
                    document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                }
            });
        })();
    });
    </script>

<script>
// ===== MOBILE MENU SCRIPT =====
document.addEventListener('DOMContentLoaded', function() {
    var menuBtn = document.querySelector('.mobile-toggle');
    var menu = document.getElementById('navMenu') || document.querySelector('.nav-links');
    
    if (!menuBtn || !menu) return;
    
    // Hamburger click
    menuBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        menu.classList.toggle('open');
        document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
    });
    
    // Dropdown clicks
    var ddBtns = document.querySelectorAll('.nav-dropdown-btn');
    for (var i = 0; i < ddBtns.length; i++) {
        ddBtns[i].addEventListener('click', function(e) {
            if (window.innerWidth <= 768) {
                e.preventDefault();
                e.stopPropagation();
                var dd = this.parentElement;
                var wasOpen = dd.classList.contains('open');
                // Close all
                var allDd = document.querySelectorAll('.nav-dropdown');
                for (var j = 0; j < allDd.length; j++) {
                    allDd[j].classList.remove('open');
                }
                // Toggle
                if (!wasOpen) dd.classList.add('open');
            }
        });
    }
    
    // Close on link click
    var links = menu.querySelectorAll('a');
    for (var i = 0; i < links.length; i++) {
        links[i].addEventListener('click', function() {
            if (window.innerWidth <= 768) {
                menu.classList.remove('open');
                document.body.style.overflow = '';
            }
        });
    }
});
</script>

<script>
// Legend Toggle
document.addEventListener('DOMContentLoaded', function() {
    var btn = document.querySelector('.legend-toggle');
    var legend = document.querySelector('.legend');
    if (!btn || !legend) return;
    
    btn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        legend.classList.toggle('legend-visible');
        btn.classList.toggle('active');
    });
    
    document.addEventListener('click', function(e) {
        if (!legend.contains(e.target) && !btn.contains(e.target)) {
            legend.classList.remove('legend-visible');
            btn.classList.remove('active');
        }
    });
});
</script>
