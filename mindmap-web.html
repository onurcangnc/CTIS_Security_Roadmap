<script>
document.addEventListener('DOMContentLoaded', function() {
    var menuBtn = document.querySelector('.mobile-toggle');
    var menu = document.getElementById('navMenu') || document.querySelector('.nav-links');

    if (!menuBtn || !menu) return;

    menuBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        menu.classList.toggle('open');
        document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
    });

    var ddBtns = document.querySelectorAll('.nav-dropdown-btn');
    for (var i = 0; i < ddBtns.length; i++) {
        ddBtns[i].addEventListener('click', function(e) {
            if (window.innerWidth <= 768) {
                e.preventDefault();
                e.stopPropagation();
                var dd = this.parentElement;
                var wasOpen = dd.classList.contains('open');
                var allDd = document.querySelectorAll('.nav-dropdown');
                for (var j = 0; j < allDd.length; j++) {
                    allDd[j].classList.remove('open');
                }
                if (!wasOpen) dd.classList.add('open');
            }
        });
    }

    var links = menu.querySelectorAll('a');
    for (var i = 0; i < links.length; i++) {
        links[i].addEventListener('click', function() {
            if (window.innerWidth <= 768) {
                menu.classList.remove('open');
                document.body.style.overflow = '';
            }
        });
    }

    var legendToggle = document.getElementById('legendToggle');
    var legend = document.querySelector('.legend');
    if (legendToggle && legend) {
        legendToggle.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            legend.classList.toggle('show');
            legendToggle.classList.toggle('active');
        });
    }
});
</script>


<script>
    (function() {
        var menuBtn = document.querySelector('.mobile-toggle');
        var menu = document.getElementById('navMenu') || document.querySelector('.nav-links');
        
        if (!menuBtn || !menu) return;
        
        // Hamburger click toggle
        menuBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            menu.classList.toggle('open');
            document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
        });
        
        // Dropdown toggle on mobile
        var dropdownBtns = document.querySelectorAll('.nav-dropdown-btn');
        dropdownBtns.forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    e.preventDefault();
                    e.stopPropagation();
                    var dropdown = this.parentElement;
                    var wasOpen = dropdown.classList.contains('open');
                    
                    // Close all dropdowns
                    document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                        d.classList.remove('open');
                    });
                    
                    // Toggle this one
                    if (!wasOpen) {
                        dropdown.classList.add('open');
                    }
                }
            });
        });
        
        // Close menu when clicking a link
        menu.querySelectorAll('a').forEach(function(link) {
            link.addEventListener('click', function() {
                if (window.innerWidth <= 768) {
                    menu.classList.remove('open');
                    document.body.style.overflow = '';
                    document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                        d.classList.remove('open');
                    });
                }
            });
        });
        
        // Close menu when clicking outside
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 768 && menu.classList.contains('open')) {
                if (!menu.contains(e.target) && !menuBtn.contains(e.target)) {
                    menu.classList.remove('open');
                    document.body.style.overflow = '';
                    document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                        d.classList.remove('open');
                    });
                }
            }
        });
        
        // Close on escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && menu.classList.contains('open')) {
                menu.classList.remove('open');
                document.body.style.overflow = '';
                document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                    d.classList.remove('open');
                });
            }
        });
    })();
</script>
