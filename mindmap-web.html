    <script>
        // Mobile menu functionality - Fixed version
        (function() {
            const mobileToggle = document.getElementById('mobileToggle');
            const navMenu = document.getElementById('navMenu');
            
            if (!mobileToggle || !navMenu) {
                console.warn('Mobile menu elements not found');
                return;
            }
            
            // Toggle menu on click/touch
            function toggleMenu(e) {
                e.preventDefault();
                e.stopPropagation();
                navMenu.classList.toggle('open');
                mobileToggle.setAttribute('aria-expanded', navMenu.classList.contains('open'));
                // Close all dropdowns when toggling menu
                document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
            }
            
            mobileToggle.addEventListener('click', toggleMenu);
            mobileToggle.addEventListener('touchend', function(e) {
                e.preventDefault();
                toggleMenu(e);
            }, { passive: false });
            
            // Handle dropdown buttons
            document.querySelectorAll('.nav-dropdown-btn').forEach(btn => {
                function handleDropdown(e) {
                    if (window.innerWidth <= 768) {
                        e.preventDefault();
                        e.stopPropagation();
                        const parent = btn.parentElement;
                        const isOpen = parent.classList.contains('open');
                        // Close others
                        document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                        // Toggle this one
                        if (!isOpen) parent.classList.add('open');
                    }
                }
                btn.addEventListener('click', handleDropdown);
                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    handleDropdown(e);
                }, { passive: false });
            });
            
            // Close menu when clicking links
            document.querySelectorAll('.nav-dropdown-content a, .nav-links > .nav-link').forEach(link => {
                link.addEventListener('click', function() {
                    if (window.innerWidth <= 768) {
                        navMenu.classList.remove('open');
                        mobileToggle.setAttribute('aria-expanded', 'false');
                        document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                    }
                });
            });
            
            // Close menu when clicking outside
            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768 && navMenu.classList.contains('open')) {
                    if (!navMenu.contains(e.target) && !mobileToggle.contains(e.target)) {
                        navMenu.classList.remove('open');
                        mobileToggle.setAttribute('aria-expanded', 'false');
                        document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                    }
                }
            });
            
            // Handle resize
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    navMenu.classList.remove('open');
                    document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
                }
            });
        })();
    </script>

    <script>
    (function() {
        'use strict';
        
        var toggle = document.getElementById('mobileToggle') || document.querySelector('.mobile-toggle');
        var menu = document.getElementById('navMenu') || document.querySelector('.nav-links');
        
        if (!toggle || !menu) {
            console.warn('Mobile menu elements not found');
            return;
        }
        
        // Remove old event listeners by cloning
        var newToggle = toggle.cloneNode(true);
        toggle.parentNode.replaceChild(newToggle, toggle);
        toggle = newToggle;
        
        function closeMenu() {
            menu.classList.remove('open');
            document.body.style.overflow = '';
            document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                d.classList.remove('open');
            });
        }
        
        function openMenu() {
            menu.classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        
        // Toggle click
        toggle.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            if (menu.classList.contains('open')) {
                closeMenu();
            } else {
                openMenu();
            }
        });
        
        // Dropdown toggles
        document.querySelectorAll('.nav-dropdown-btn').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    var dropdown = this.parentElement;
                    var isOpen = dropdown.classList.contains('open');
                    
                    // Close all dropdowns
                    document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                        d.classList.remove('open');
                    });
                    
                    // Open this one if it was closed
                    if (!isOpen) {
                        dropdown.classList.add('open');
                    }
                }
            });
        });
        
        // Close menu when clicking a link
        menu.querySelectorAll('a').forEach(function(link) {
            link.addEventListener('click', function() {
                if (window.innerWidth <= 768) {
                    closeMenu();
                }
            });
        });
        
        // Close on resize to desktop
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                closeMenu();
            }
        });
        
        // Close on escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && menu.classList.contains('open')) {
                closeMenu();
            }
        });
    })();
    </script>


    <script>
    (function() {
        'use strict';
        
        var toggle = document.getElementById('mobileToggle') || document.querySelector('.mobile-toggle');
        var menu = document.getElementById('navMenu') || document.querySelector('.nav-links');
        
        if (!toggle || !menu) {
            console.warn('Mobile menu elements not found');
            return;
        }
        
        // Clone toggle to remove old listeners
        var newToggle = toggle.cloneNode(true);
        toggle.parentNode.replaceChild(newToggle, toggle);
        toggle = newToggle;
        
        function closeAllDropdowns() {
            document.querySelectorAll('.nav-dropdown').forEach(function(d) {
                d.classList.remove('open');
            });
        }
        
        function closeMenu() {
            menu.classList.remove('open');
            document.body.style.overflow = '';
            closeAllDropdowns();
        }
        
        function openMenu() {
            menu.classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        
        // Main toggle click
        toggle.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            if (menu.classList.contains('open')) {
                closeMenu();
            } else {
                openMenu();
            }
        });
        
        // Dropdown button clicks
        var dropdownBtns = document.querySelectorAll('.nav-dropdown-btn');
        dropdownBtns.forEach(function(btn) {
            // Clone to remove old listeners
            var newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            
            newBtn.addEventListener('click', function(e) {
                // Only handle on mobile
                if (window.innerWidth > 768) return;
                
                e.preventDefault();
                e.stopPropagation();
                
                var dropdown = this.closest('.nav-dropdown');
                if (!dropdown) return;
                
                var wasOpen = dropdown.classList.contains('open');
                
                // Close all dropdowns first
                closeAllDropdowns();
                
                // Toggle this dropdown
                if (!wasOpen) {
                    dropdown.classList.add('open');
                }
            });
        });
        
        // Close menu when clicking a nav link (not dropdown btn)
        menu.querySelectorAll('a').forEach(function(link) {
            link.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    // Small delay to allow navigation
                    setTimeout(closeMenu, 100);
                }
            });
        });
        
        // Close on resize to desktop
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                closeMenu();
            }
        });
        
        // Close on escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeMenu();
            }
        });
        
        // Prevent body scroll when menu is open
        menu.addEventListener('touchmove', function(e) {
            e.stopPropagation();
        }, { passive: true });
        
    })();
    </script>
